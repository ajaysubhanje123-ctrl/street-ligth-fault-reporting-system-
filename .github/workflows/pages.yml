name: Publish static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract project and prepare static site
        run: |
          mkdir extracted
          unzip -q street-light-updated.zip -d extracted
          mkdir site
          cp -R extracted/public/. site/
          python3 -c 'from pathlib import Path; p=Path("site/index.html"); s=p.read_text(); p.write_text(s.replace("<head>", "<head>\n  <base href=\"/street-ligth-fault-reporting-system-/\">", 1))'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
